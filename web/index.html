<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080c11" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23cc0033'/%3E%3Cpath d='M4 21c4-4 8 4 12 0s8 4 12 0' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
  <title>HackRU-26 · Raritan Flood Command</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">RU</span>
      <div><h1 class="title">HackRU-26</h1><div class="sub">Raritan flood command · New Brunswick, NJ</div></div>
    </div>
    <div class="top-status" id="top-status"></div>
  </header>
  <main class="layout">
    <aside class="col left" id="col-left" aria-label="River and observations"></aside>
    <section class="mapwrap">
      <div id="map"></div>
      <details class="map-layers card" id="layers-box" open><summary>Layers</summary><div id="map-layers" class="layer-list"></div></details>
      <details class="legend card" id="legend-box" open><summary>Legend</summary><div id="legend" class="legend-grid"></div></details>
      <div class="map-hint" id="map-hint" aria-live="polite">Click a road for its status</div>
    </section>
    <aside class="col right" id="col-right" aria-label="Where to go and reports"></aside>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
